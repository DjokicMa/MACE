[pytest]
# The whole regression suite lives in tests/. Keep discovery scoped there so
# pytest never walks the source trees or the read-only test/ data corpus.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    gui: drives the GUI in headless Firefox (skipped without selenium, Firefox or geckodriver)
    guibench: GUI performance budgets (opt-in: MACE_GUI_BENCH=1); writes bench_report.json
    guivisible: real key events in a visible Firefox under Xvfb (opt-in: MACE_GUI_VISIBLE=1)
    guismoke: the GUI browser smoke subset (runs in CI with headless Firefox and Chromium, software WebGL, repo data only)
    xdist_group(name): pytest-xdist runs a group on one worker (a no-op without xdist)
    dbconcurrency: simultaneous materials.db writers and killed writers (one case at a time; tests/test_db_concurrency.py)
