# CRYSTAL Error Recovery Configuration
# ====================================
# How MACE recovers a failed CRYSTAL job, per error type.
#
# Which file is used (the first that exists):
#   1. a path given explicitly (mace recover --config <file>)
#   2. recovery_config.yaml in the directory the recovery runs in - the job
#      directory when the queue manager runs as a job's completion callback
#   3. this file, shipped in mace/config
#
# The file is laid over MACE's built-in defaults key by key: a copy that sets
# only `timeout_error: {max_retries: 1}` changes that one value and keeps
# every other default. An entry whose `handler` does not exist is reported;
# for an error type listed below the listed handler is used with the entry's
# other settings (so its max_retries still counts), and `manual_escalation`
# means max_retries: 0. Any other unknown entry is ignored.
#
# The values below ARE the built-in defaults; only the keys listed are read.
# Handlers that exist: fixk_handler, memory_handler, convergence_handler,
# timeout_handler, opt_fresh_start_handler, cleanup_handler.
# Setting max_retries: 0 switches automatic recovery off for that error type.
#
# Not recovered automatically - these need a person, and have no entry here:
# linearly dependent basis sets, geometry/NEIGHB problems and symmetry errors.

error_recovery:
  # SHRINK parameter errors - k-point mesh inconsistent with the cell
  shrink_error:
    handler: "fixk_handler"              # Uses the fixk.py script
    max_retries: 3                       # Maximum recovery attempts
    resubmit_delay: 300                  # Delay before resubmission (seconds)
    escalate_on_failure: true
    description: "Fixes k-point mesh issues using fixk.py script"

  # Memory allocation errors - job killed for exceeding its memory
  memory_error:
    handler: "memory_handler"
    memory_factor: 1.5                   # Multiply the job's memory (--mem or --mem-per-cpu) by this
    max_memory: "200GB"                  # Never ask for more than this
    max_retries: 2
    resubmit_delay: 600
    description: "Increases the job's memory request, keeping its --mem / --mem-per-cpu form"

  # SCF convergence failures
  convergence_error:
    handler: "convergence_handler"
    max_cycles_increase: 1000            # Added to the SCF MAXCYCLE (never the OPTGEOM one)
    fmixing_adjustment: 10               # Subtracted from FMIXING when the deck sets it (floor 10)
    max_retries: 2
    resubmit_delay: 300
    description: "Raises the SCF MAXCYCLE and adjusts FMIXING"

  # Job timeout errors - calculation exceeded its walltime
  timeout_error:
    handler: "timeout_handler"
    walltime_factor: 2.0                 # Multiply the job's walltime by this
    max_walltime: "7-00:00:00"           # Used only when SLURM can't be asked: the cap is
                                         # otherwise read live from the job's own queue
                                         # (7 days on HPCC; 14 on mendoza_q_long)
    max_retries: 2
    resubmit_delay: 900
    enable_restart: true                 # OPT killed mid-optimization: OPTGEOM RESTART, or a
                                         # fresh OPT from the best point when OPTINFO.DAT is gone
                                         # (at the queue limit only these are resubmitted)
    description: "Increases walltime up to the queue limit; an optimization continues from its last completed step"

  # Geometry optimization aborted because its step size (trust radius) collapsed to
  # zero - seen when a RESTART rerun re-evaluates its best point and finds no energy
  # change ("PXK TOO SMALL" in scratch fort.87, MPI_Abort, SLURM says COMPLETED).
  opt_trust_radius_error:
    handler: "opt_fresh_start_handler"
    max_retries: 2                       # Fresh optimization from the best point reached
    resubmit_delay: 300
    description: "Removes RESTART and starts a fresh optimization from the lowest-energy geometry reached so far; the original deck is kept as <JOB>.d12.orig"

  # Disk space errors - quota or scratch full
  disk_space_error:
    handler: "cleanup_handler"
    cleanup_scratch: true                # Delete temporary files over 100 MB in the job
                                         # directory (never fort.9/.f9/fort.20/fort.98/fort.34)
    max_retries: 1
    resubmit_delay: 1800
    description: "Frees large temporary files and resubmits; if the quota is still exceeded, clean up by hand (du -sh $SCRATCH/*, quota -u $USER)"

# Global settings for the recovery system
global_settings:
  max_concurrent_recoveries: 10          # Recoveries attempted per `mace recover` run
  recovery_log_retention_days: 30
  enable_auto_escalation: true
  notification_enabled: false
