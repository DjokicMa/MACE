name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The CI baseline (3.11) plus the interpreter developers actually run
        # locally (3.12, the anaconda env with ase/spglib/seekpath), so CI and
        # dev can't silently diverge on a version-specific issue.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run regression suite
        # The ~12GB test/ corpus is gitignored and not present in CI, so the
        # data-dependent tests skip; the self-contained logic tests run.
        run: python -m pytest -ra
